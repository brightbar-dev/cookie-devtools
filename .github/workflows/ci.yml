name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: read # pnpm install pulls @brightbar-dev/review-nudge from GitHub Packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm exec wxt prepare
      - run: pnpm test
      # `wxt build` strips types without checking them, so only tsc can fail on a type error.
      - run: pnpm exec tsc --noEmit
      - name: Build Chrome
        run: pnpm exec wxt build
      # Allowlist guard: fails if the manifest asks for more than it ships with today. The install
      # prompt already shows one line, "Read and change all your data on all websites" (from
      # <all_urls>); the script's header records how that was measured.
      - run: node scripts/check-manifest.mjs .output/chrome-mv3/manifest.json
      - name: Build Firefox
        run: pnpm exec wxt build --browser firefox
