name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx wxt prepare
      - run: npm test
      # `wxt build` strips types without checking them, so only tsc can fail on a type error.
      - run: npx tsc --noEmit
      - name: Build Chrome
        run: npx wxt build
      # The install prompt must stay warning-free (see wxt.config.ts).
      - run: node scripts/check-manifest.mjs .output/chrome-mv3/manifest.json
      - name: Build Firefox
        run: npx wxt build --browser firefox
