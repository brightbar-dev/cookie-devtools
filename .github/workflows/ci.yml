name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: read # npm ci installs @brightbar-dev/review-nudge from GitHub Packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npx wxt prepare
      - run: npm test
      # `wxt build` strips types without checking them, so only tsc can fail on a type error.
      - run: npx tsc --noEmit
      - name: Build Chrome
        run: npx wxt build
      # Allowlist guard: fails if the manifest asks for more than it ships with today. The install
      # prompt already shows one line, "Read and change all your data on all websites" (from
      # <all_urls>); the script's header records how that was measured.
      - run: node scripts/check-manifest.mjs .output/chrome-mv3/manifest.json
      - name: Build Firefox
        run: npx wxt build --browser firefox
