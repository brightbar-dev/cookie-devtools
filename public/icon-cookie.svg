<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Blue rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="24" fill="#4A90D9"/>

  <!-- Cookie body -->
  <circle cx="58" cy="56" r="36" fill="#D4A056"/>
  <circle cx="58" cy="56" r="36" fill="none" stroke="#B8863C" stroke-width="2"/>

  <!-- Bite mark -->
  <circle cx="84" cy="34" r="13" fill="#4A90D9"/>

  <!-- Chocolate chips -->
  <ellipse cx="44" cy="46" rx="6" ry="5" fill="#5C3317" transform="rotate(-15 44 46)"/>
  <ellipse cx="64" cy="50" rx="5" ry="4.5" fill="#5C3317" transform="rotate(10 64 50)"/>
  <ellipse cx="48" cy="68" rx="5.5" ry="5" fill="#5C3317" transform="rotate(-5 48 68)"/>
  <ellipse cx="70" cy="70" rx="5" ry="4" fill="#5C3317" transform="rotate(20 70 70)"/>
  <ellipse cx="38" cy="58" rx="4" ry="3.5" fill="#5C3317" transform="rotate(-10 38 58)"/>

  <!-- Cookie texture dots -->
  <circle cx="56" cy="38" r="2" fill="#C4944A"/>
  <circle cx="76" cy="60" r="1.5" fill="#C4944A"/>

  <!-- Code badge circle (bottom right) -->
  <circle cx="98" cy="98" r="26" fill="#1E4D8C"/>

  <!-- < as filled polygon -->
  <polygon points="91,85 79,98 91,111 86,111 74,98 86,85" fill="#FFFFFF"/>
  <!-- > as filled polygon -->
  <polygon points="105,85 117,98 105,111 110,111 122,98 110,85" fill="#FFFFFF"/>
  <!-- / as filled rect rotated -->
  <rect x="95" y="83" width="4" height="30" rx="2" fill="#FFFFFF" transform="rotate(15 97 98)"/>
</svg>
