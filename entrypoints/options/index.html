<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="manifest.open_in_tab" />
  <title data-i18n="optionsPageTitle"></title>
</head>
<body>
  <div class="container">
    <h1 data-i18n="optionsHeading"></h1>

    <section>
      <h2 data-i18n="optionsAppearance"></h2>
      <label class="setting-row">
        <span data-i18n="optionsTheme"></span>
        <select id="theme">
          <option value="auto" data-i18n="optionsThemeAuto"></option>
          <option value="light" data-i18n="optionsThemeLight"></option>
          <option value="dark" data-i18n="optionsThemeDark"></option>
        </select>
      </label>
    </section>

    <section>
      <h2 data-i18n="tabMonitor"></h2>
      <label class="setting-row">
        <span data-i18n="optionsMaxLog"></span>
        <select id="max-log">
          <option value="100">100</option>
          <option value="250">250</option>
          <option value="500" selected>500</option>
          <option value="1000">1000</option>
        </select>
      </label>
    </section>

    <section>
      <h2 data-i18n="optionsRulesHeading"></h2>
      <p class="setting-help" data-i18n="optionsRulesHelp"></p>
      <ul id="rules-list" class="rules-list"></ul>
    </section>

    <section>
      <h2 data-i18n="optionsData"></h2>
      <div class="setting-row">
        <span data-i18n="optionsClearDataLabel"></span>
        <button id="btn-clear-data" class="action-btn danger" data-i18n="optionsClearData"></button>
      </div>
    </section>

    <section>
      <h2 data-i18n="optionsAbout"></h2>
      <p id="about-version" data-i18n="appName"></p>
      <p data-i18n="optionsAboutSummary"></p>
      <p data-i18n="optionsAboutPrivacy"></p>
    </section>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
